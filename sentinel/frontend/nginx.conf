server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # App.jsx iframes the landing page at /public/landing.html (the path
    # vercel.json exposes). CRA copies public/ to the build root, so the
    # local copy lives at /landing.html — rewrite to keep both deployments
    # serving the same URL.
    rewrite ^/public/landing.html$ /landing.html last;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
