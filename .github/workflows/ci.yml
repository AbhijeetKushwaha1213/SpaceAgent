name: CI

# Phase 1 requirement: the command-registry consistency check must run in
# development, test and CI. This workflow is the CI half.
#
# The gate is `python -m app.validation.conflicts`, which exits non-zero if the
# procedure/RAG layer, the LLM prompt, the training-data generator or the demo
# cache reference a command the registry does not define. That is the class of
# drift that let the knowledge base recommend 12 commands the safety validator
# then blocked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  safety-consistency:
    name: Command registry consistency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies needed by the checker
        # The checker only needs pydantic and python-dotenv. It deliberately
        # avoids the LLM/RAG stack so it can run without network access or API
        # keys, which is what makes it usable as a fast gate.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.0" "python-dotenv>=1.0"

      - name: Registry / procedure consistency check
        run: python -m app.validation.conflicts

      # Phase 5 gate. Fails on an internal contradiction in the channel
      # dictionary. The five nominal-versus-limits conflicts inherited from the
      # tables it replaced are reported as KNOWN and do not fail the build; a NEW
      # one does. See sentinel/docs/phase5_channel_conflicts.md.
      - name: Channel dictionary consistency check
        run: python -m app.ingest.channel_dict

      - name: Phase 1 — registry and conflict-checker tests
        run: python -m unittest tests.test_phase1_registry -v

      - name: Phase 1 — blocked-plan behaviour tests
        run: python -m unittest tests.test_phase1_blocked_plans -v

      - name: Phase 2 — anomaly detection tests
        run: python -m unittest tests.test_phase2_detection -v

      - name: Phase 0 — provenance labelling tests
        run: python -m unittest tests.test_phase0_provenance -v

      # Phase 3 gate. `--check` regenerates the contract in memory and
      # byte-compares it against what is committed, so changing a Pydantic model
      # without regenerating contracts/ fails here rather than surfacing later as
      # a missing field in the operator's browser.
      - name: Phase 3 — contract artifacts are not stale
        run: python scripts/export_contracts.py --check

      - name: Phase 3 — data contract and schema tests
        run: python -m unittest tests.test_phase3_contract -v

      # Phase 4 gate. Covers redaction, append-only enforcement at all three
      # levels, the hash chain, honest recording of the stages this build does
      # not implement, and that a client cannot write a system stage.
      - name: Phase 4 — audit trail tests
        run: python -m unittest tests.test_phase4_audit -v

      # Covers dictionary completeness, that no consumer declares its own
      # thresholds, that the consolidation reproduces both source tables exactly,
      # explicit UNKNOWN handling, and that no engineering threshold is left in
      # the LLM prompt.
      - name: Phase 5 — channel dictionary tests
        run: python -m unittest tests.test_phase5_channel_dict -v

      # Phase 6 gates. The dictionary check fails on a fault whose signature
      # names a channel that does not exist — such a fault can never match, so it
      # becomes silently unreachable. The propagation check fails on a duplicate
      # or unmechanised edge, which would distort candidate ranking invisibly.
      - name: Phase 6 — fault dictionary consistency check
        run: python -m app.diagnosis.fault_dictionary

      - name: Phase 6 — propagation graph consistency check
        run: python -m app.diagnosis.propagation

      # Phase 7 gates. The parameter check fails if an assumed constant does not
      # declare which residuals it affects, and if the thermal derivation stops
      # landing its heater-off steady state on the nominal midpoint — which would
      # make the model report a residual on healthy telemetry. The estimation
      # check fails if a predicted channel has no declared tolerance, since its
      # residual could then never be decided and the model would silently never
      # contribute.
      - name: Phase 7 — model parameter consistency check
        run: python -m app.estimation.parameters

      - name: Phase 7 — estimation consistency check
        run: python -m app.estimation.residuals

      # Covers the required deterministic scenarios: physically consistent
      # behaviour, violated dynamics, a sensor under-reporting motion, actuator
      # under-response, staleness handling on asynchronous telemetry, that
      # UNDECIDABLE is never reported as a pass, and that no language model can
      # be reached from the package.
      - name: Phase 7 — state estimation and residual tests
        run: python -m unittest tests.test_phase7_estimation -v

      # Phase 8 gate. Fails if a fault in the Phase 6 dictionary has no physics
      # claims entry — silence there would make an UNCERTAIN verdict
      # indistinguishable from an oversight — if a declared constraint has no
      # evaluator, or if a constraint rests on a channel with no Phase 7
      # tolerance, in which case it could never be decided.
      - name: Phase 8 — physics validation consistency check
        run: python -m app.validation.physics

      # Covers rejection of intentionally wrong hypotheses across every check
      # family that can refute, the asymmetry that absent evidence yields
      # UNCERTAIN rather than INVALID, faults the models cannot reach, and that
      # no code path lets a language model change a verdict.
      - name: Phase 8 — physics validation tests
        run: python -m unittest tests.test_phase8_physics -v

      - name: Phase 4 — worked audit example runs end to end
        run: python scripts/example_audit_run.py

      # Runs the real provenance resolver under node rather than pattern-matching
      # the source. Skips itself if node is absent.
      - name: Phase 0 — frontend truth-in-labeling tests
        run: python -m unittest tests.test_phase0_frontend -v

      - name: Safety validator suite
        run: python tests/test_safety.py

      - name: Simulator suites
        run: |
          python -m unittest tests.test_constructor tests.test_helpers \
                             tests.test_generate_crash_dump -v

      - name: Model contract suite
        run: python tests/test_models.py
