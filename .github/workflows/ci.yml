name: SENTINEL CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Run Backend Test Suite & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentinel/backend/requirements.txt

      - name: Export OpenAPI & Frontend Contract Bindings
        run: |
          python sentinel/backend/scripts/export_contracts.py

      - name: Execute Full Python Test Suite Across All Phases
        run: |
          python -c "import unittest; loader = unittest.TestLoader(); suite = loader.discover('sentinel/backend/tests', pattern='test_*.py'); runner = unittest.TextTestRunner(verbosity=2); result = runner.run(suite); raise SystemExit(0 if result.wasSuccessful() else 1)"

      - name: Phase 14 Security & Data Handling Tests
        run: |
          cd sentinel/backend/tests
          python -m unittest test_phase14_security -v

  build-frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: sentinel/frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd sentinel/frontend
          npm ci || npm install

      - name: Build Production Frontend Assets
        run: |
          cd sentinel/frontend
          npm run build
