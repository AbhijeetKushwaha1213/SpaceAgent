name: SENTINEL CI Pipeline

on:
  push:
    branches: [ main, master, sentinel-v2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: Run ruff check
        run: ruff check sentinel/backend/app sentinel/backend/tests sentinel/backend/scripts

  test-backend:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentinel/backend/requirements-dev.txt

      - name: Export OpenAPI & Frontend Contract Bindings
        run: |
          python sentinel/backend/scripts/export_contracts.py

      - name: Execute Full Python Test Suite
        run: |
          cd sentinel/backend
          python -m pytest tests/ -q -p no:cacheprovider --ignore=tests/run_tests.py

      - name: Phase 14 Security & Data Handling Tests
        run: |
          cd sentinel/backend
          python -m pytest tests/test_phase14_security.py -v -p no:cacheprovider

  build-frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: sentinel/frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd sentinel/frontend
          npm ci || npm install

      - name: Build Production Frontend Assets
        run: |
          cd sentinel/frontend
          npm run build

  build-docker:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t sentinel-backend:ci sentinel/backend
